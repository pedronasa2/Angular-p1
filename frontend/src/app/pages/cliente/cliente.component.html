<dx-button
  text="voltar"
  type="default"
  icon="back"
  [width]="150"
  routerLink="/inicioloja"
>
</dx-button>
<div id="data-grid-demo">
  <dx-data-grid #clienteGrid
                [dataSource]="listaDeClientes"
                keyExpr="id"
                [showBorders]="true"
                (onRowRemoved)="onRowRemoved($event)"
                (onRowInserted)="onRowInserted($event)"
                (onRowUpdated)="onRowUpdated($event)"
  >
    <dxo-search-panel
      [visible]="true"
      [width]="240"
      placeholder="Pesquisar">
    </dxo-search-panel>

    <dxo-data-grid-paging [enabled]="false"></dxo-data-grid-paging>
    <dxo-data-grid-editing
      mode="popup"
      [allowUpdating]="true"
      [allowAdding]="true"
      [allowDeleting]="true"
    >
      <dxo-data-grid-popup
        title="Informações cliente"
        [showTitle]="true"
        [width]="700"
        [height]="525"
      >
      </dxo-data-grid-popup>
      <dxo-data-grid-form>
        <dxi-data-grid-item itemType="group" [colCount]="2" [colSpan]="2">

          <dxi-data-grid-item
            dataField="nome" [colCount]="2" [colSpan]="2">
          </dxi-data-grid-item>
          <dxi-data-grid-item
            dataField="codigo" [colCount]="2" [colSpan]="2">
          </dxi-data-grid-item>
        </dxi-data-grid-item>


      </dxo-data-grid-form>
    </dxo-data-grid-editing>

    <dxi-data-grid-column dataField="nome" caption="Nome">
    </dxi-data-grid-column>
    <dxi-data-grid-column dataField="codigo" caption="Codigo">
    </dxi-data-grid-column>

  </dx-data-grid>
</div>
